<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#39648D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="學習筆記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>學習筆記</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=54">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button id="brand" aria-label="切換 App（目前：學習筆記）"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 8.2C11.2 5.6 6.8 5 3 6.1v17.8c3.8-1.1 8.2-.5 12 2.1z" fill="#39648D"/><path d="M15 8.2c3.8-2.6 8.2-3.2 12-2.1v17.8c-3.8-1.1-8.2-.5-12 2.1z" fill="#48A88B"/><path d="M19.6 3.6h4.2v8.6l-2.1-1.7-2.1 1.7z" fill="#F3CC58"/></svg><span class="name">學習筆記</span><svg class="brand-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="spacer"></span>
    <button id="hdr-ask" class="hdr-ask" data-act="askpop" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="#4C8DF6"/><circle cx="8.5" cy="11" r="1.3" fill="#fff"/><circle cx="12" cy="11" r="1.3" fill="#fff"/><circle cx="15.5" cy="11" r="1.3" fill="#fff"/></svg>問助理</button>
    <button id="pill" class="pill" data-act="tab" data-v="prefs">連線中</button>
  </header>
  <div id="vbox" class="vbox" hidden></div>
  <main id="main" aria-live="polite">
    <div class="card flat"><div class="row"><span class="spinner"></span><span>載入中…</span></div></div>
  </main>
  <div id="mini" class="mini" hidden></div>
  <div id="askpop" class="sheet askpop" hidden><button class="sheet-bg" data-act="askpop-close" aria-label="關閉"></button><div class="sheet-card askpop-card" id="askpop-card" role="dialog" aria-label="問助理"></div></div>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab" data-act="tab" data-v="books"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="4.6" height="16" rx="1.2" fill="#4DB892"/><rect x="8.6" y="2.5" width="4.6" height="17.5" rx="1.2" fill="#4C8BE0"/><path d="M14.6 5.6l3.9-1.1 3 14.5-3.9 1.1z" fill="#EB5D5D"/><rect x="2" y="20" width="20" height="2" rx="1" fill="#9AA6B3"/></svg></span>書櫃</button>
    <button class="tab" data-act="tab" data-v="review"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3" fill="#F3B93D"/><rect x="3" y="4" width="18" height="5" rx="2.5" fill="#E66B44"/><rect x="7" y="2" width="2.4" height="5" rx="1.2" fill="#9AA6B3"/><rect x="14.6" y="2" width="2.4" height="5" rx="1.2" fill="#9AA6B3"/><path d="M8 14.5l2.6 2.6L16.5 11" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>知識複習</button>
    <button class="tab" data-act="tab" data-v="ask"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-4.6 3.7c-.6.5-1.4 0-1.4-.7V17a2.5 2.5 0 0 1-1-2z" fill="#4C8BE0"/><circle cx="8.2" cy="10" r="1.4" fill="#fff"/><circle cx="12" cy="10" r="1.4" fill="#fff"/><circle cx="15.8" cy="10" r="1.4" fill="#FFE07A"/></svg></span>助理</button>
    <button class="tab" data-act="tab" data-v="prefs"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 2h3.4l.5 2.6 1.7.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.7 2.6.5v3.4l-2.6.5-.8 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.8-.5 2.6h-3.4l-.5-2.6-1.7-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.7L2 13.7v-3.4l2.6-.5.8-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.8z" fill="#8A97A6"/><circle cx="12" cy="12" r="3.4" fill="#fff"/></svg></span>設定</button>
  </nav>
  <div id="sheet" class="sheet" hidden>
    <button class="sheet-bg" data-act="close-sheet" aria-label="關閉"></button>
    <div class="sheet-card" id="sheet-card" role="dialog" aria-modal="true"></div>
  </div>
  <div id="gate" class="gate" hidden></div>
  <div id="dialog" class="dialog" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <audio id="au" preload="metadata"></audio>
  <input type="file" id="pick-lecture" accept="audio/*,video/*,.m4a,.mp3,.wav,.mp4,.mov,.mkv,.webm" hidden>
  <input type="file" id="pick-book" accept=".pdf,.epub,.txt,.md,application/pdf,application/epub+zip" hidden>
  <input type="file" id="pick-cover" accept="image/*" capture="environment" hidden>
  <input type="file" id="pick-cover-lib" accept="image/*" hidden>
  <input type="file" id="pick-evid" accept="image/*" hidden>
  <input type="file" id="pick-photo" accept="image/*" capture="environment" hidden>
</div>

<script src="js/core.js?v=54"></script>
<script src="js/upload.js?v=54"></script>
<script src="js/pages.js?v=54"></script>
<script src="js/lecture.js?v=54"></script>
<script src="js/wish.js?v=54"></script>
<script src="js/assist.js?v=54"></script>
<script src="js/shelf.js?v=54"></script>
<script src="js/settings.js?v=54"></script>
<script src="js/apps.js?v=42"></script>
<script src="js/actions.js?v=54"></script>
</body>
</html>

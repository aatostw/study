<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#39648D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="學習筆記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>學習筆記</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=2">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
      <rect x="2" y="7" width="17" height="19" rx="5" fill="#39648D"/>
      <rect x="10" y="3" width="17" height="19" rx="5" fill="#48A88B"/>
      <circle cx="23" cy="24" r="4" fill="#F3CC58"/>
    </svg>
    <span class="name">學習筆記</span>
    <span class="spacer"></span>
    <button id="pill" class="pill" data-act="tab" data-v="prefs">連線中</button>
  </header>
  <main id="main" aria-live="polite">
    <div class="card flat"><div class="row"><span class="spinner"></span><span>載入中…</span></div></div>
  </main>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab" data-act="tab" data-v="ask"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-4.6 3.7c-.6.5-1.4 0-1.4-.7V17a2.5 2.5 0 0 1-1-2z" fill="#4C8BE0"/><circle cx="8.2" cy="10" r="1.4" fill="#fff"/><circle cx="12" cy="10" r="1.4" fill="#fff"/><circle cx="15.8" cy="10" r="1.4" fill="#FFE07A"/></svg></span>問答</button>
    <button class="tab" data-act="tab" data-v="books"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="4.6" height="16" rx="1.2" fill="#4DB892"/><rect x="8.6" y="2.5" width="4.6" height="17.5" rx="1.2" fill="#4C8BE0"/><path d="M14.6 5.6l3.9-1.1 3 14.5-3.9 1.1z" fill="#EB5D5D"/><rect x="2" y="20" width="20" height="2" rx="1" fill="#9AA6B3"/></svg></span>書櫃</button>
    <button class="tab" data-act="tab" data-v="lectures"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="13.5" rx="2.5" fill="#4DB892"/><path d="M10 8v6l5-3z" fill="#fff"/><rect x="7" y="19.5" width="10" height="2" rx="1" fill="#9AA6B3"/></svg></span>課程</button>
    <button class="tab" data-act="tab" data-v="tts"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5h3.5L11.5 5v14l-5-4.5H3z" fill="#E66B44"/><path d="M15 8.5a5 5 0 0 1 0 7M18 5.5a9 9 0 0 1 0 13" fill="none" stroke="#F3B93D" stroke-width="2.2" stroke-linecap="round"/></svg></span>朗讀</button>
    <button class="tab" data-act="tab" data-v="prefs"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 2h3.4l.5 2.6 1.7.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.7 2.6.5v3.4l-2.6.5-.8 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.8-.5 2.6h-3.4l-.5-2.6-1.7-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.7L2 13.7v-3.4l2.6-.5.8-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.8z" fill="#8A97A6"/><circle cx="12" cy="12" r="3.4" fill="#fff"/></svg></span>設定</button>
  </nav>
  <div id="sheet" class="sheet" hidden>
    <button class="sheet-bg" data-act="close-sheet" aria-label="關閉"></button>
    <div class="sheet-card" id="sheet-card" role="dialog" aria-modal="true"></div>
  </div>
  <div id="gate" class="gate" hidden></div>
  <div id="dialog" class="dialog" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <audio id="au" preload="metadata"></audio>
  <input type="file" id="pick-lecture" accept="audio/*,video/*,.m4a,.mp3,.wav,.mp4,.mov,.mkv,.webm" hidden>
  <input type="file" id="pick-book" accept=".pdf,.epub,.txt,.md,application/pdf,application/epub+zip" hidden>
  <input type="file" id="pick-photo" accept="image/*" capture="environment" hidden>
</div>

<script src="js/core.js?v=1"></script>
<script src="js/upload.js?v=1"></script>
<script src="js/pages.js?v=1"></script>
<script src="js/lecture.js?v=1"></script>
<script src="js/settings.js?v=1"></script>
<script src="js/actions.js?v=1"></script>
</body>
</html>
